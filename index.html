
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control de imágenes</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
  background:#171923;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:20px;
}

.panel {
  max-width:600px;
  margin:18px auto;
  padding:20px;
  background:#25283a;
  border-radius:15px;
}

button,input {
  padding:11px;
  margin:7px;
  border-radius:8px;
}

button {
  cursor:pointer;
  border:0;
  background:#8065ed;
  color:white;
}

input[type=range] { width:85%; }

.hidden { display:none; }

#previewArea {
  height:250px;
  background:#111;
  border:1px solid #555;
  position:relative;
  overflow:hidden;
  margin:15px 0;
}

#preview {
  position:absolute;
  max-width:none;
  max-height:none;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

#screen {
  position:fixed;
  inset:0;
  background:#111;
  overflow:hidden;
  z-index:10;
}

#screen img {
  position:absolute;
  max-width:none;
  max-height:none;
  transform:translate(-50%,-50%);
}

#screenClose {
  position:fixed;
  right:12px;
  top:12px;
  z-index:20;
}
label { display:block; margin-top:14px; }
</style>
</head>

<body>

<h1>CONTROL DE IMÁGENES</h1>

<div class="panel">
  <button onclick="startReceiver()">RECIBIR IMÁGENES</button>
  <button onclick="showSender()">ENVIAR IMÁGENES</button>
  <p id="status">Sin conexión</p>
</div>

<div class="panel hidden" id="receiver">
  <h2>RECEPTOR</h2>
  <p>Comparte este código con el remitente:</p>
  <h2 id="myid">Conectando...</h2>
  <p id="incoming">Esperando conexión...</p>
  <button onclick="closeReceiver()">Cerrar receptor</button>
</div>

<div class="panel hidden" id="sender">
  <h2>TU PANEL DE CONTROL</h2>

  <input id="remoteid" placeholder="Código de tu amigo">
  <br>
  <button onclick="connect()">CONECTAR</button>

  <hr>

  <input type="file" id="photo" accept="image/*">
  <br>
  <button onclick="sendImage()">ENVIAR FOTO</button>
  <button onclick="clearImage()">QUITAR FOTO</button>

  <div id="previewArea">
    <img id="preview">
  </div>

  <label>Posición horizontal</label>
  <input id="x" type="range" min="0" max="100" value="50">

  <label>Posición vertical</label>
  <input id="y" type="range" min="0" max="100" value="50">

  <label>Tamaño</label>
  <input id="size" type="range" min="5" max="100" value="35">

  <label>Rotación</label>
  <input id="rotation" type="range" min="0" max="360" value="0">

  <p id="sendstatus">Sin conexión</p>
</div>

<script>
let peer = null;
let connection = null;
let currentImage = null;
let isReceiver = false;

const $ = id => document.getElementById(id);

function showStatus(text) {
  $("status").textContent = text;
}

function getState() {
  return {
    x: Number($("x").value),
    y: Number($("y").value),
    size: Number($("size").value),
    rotation: Number($("rotation").value)
  };
}

function applyStyle(img, state, width, height) {
  img.style.left = state.x + "%";
  img.style.top = state.y + "%";
  img.style.width = state.size + "%";
  img.style.height = "auto";
  img.style.transform =
    "translate(-50%,-50%) rotate(" + state.rotation + "deg)";
}

function updatePreview() {
  const state = getState();
  if (currentImage) {
    applyStyle($("preview"), state);
  }
}

function sendState() {
  updatePreview();

  if (connection && connection.open && currentImage) {
    connection.send({
      type:"position",
      state:getState()
    });
  }
}

["x","y","size","rotation"].forEach(id => {
  $(id).addEventListener("input",sendState);
});

function startReceiver() {
  if (peer) peer.destroy();

  isReceiver = true;
  $("receiver").classList.remove("hidden");
  $("sender").classList.add("hidden");

  peer = new Peer();

  peer.on("open", id => {
    $("myid").textContent = id;
    showStatus("Receptor preparado");
  });

  peer.on("connection", conn => {
    if (!confirm("¿Aceptar conexión para recibir imágenes?")) {
      conn.close();
      return;
    }

    connection = conn;

    conn.on("open", () => {
      $("incoming").textContent = "Conectado";
    });

    conn.on("data", receiveData);

    conn.on("close", () => {
      $("incoming").textContent = "Conexión cerrada";
      $("screen").classList.add("hidden");
    });
  });

  peer.on("error", e => showStatus("Error: " + e.type));
}

function showSender() {
  $("sender").classList.remove("hidden");
  $("receiver").classList.add("hidden");
}

function connect() {
  if (peer) peer.destroy();

  const id = $("remoteid").value.trim();
  if (!id) return alert("Introduce el código");

  peer = new Peer();

  peer.on("open", () => {
    connection = peer.connect(id);

    connection.on("open", () => {
      $("sendstatus").textContent = "Conectado";
    });

    connection.on("close", () => {
      $("sendstatus").textContent = "Desconectado";
    });
  });

  peer.on("error", e => {
    $("sendstatus").textContent = "Error: " + e.type;
  });
}
  
let pastedImage = null;

document.addEventListener("paste", (event) => {
  const items = event.clipboardData.items;

  for (const item of items) {
    if (item.type.startsWith("image/")) {
      pastedImage = item.getAsFile();
      $("sendstatus").textContent = "Imagen copiada. Pulsa Enviar.";
      return;
    }
  }
});
  
function sendImage() {
  const file = $("photo").files[0] || pastedImage;

  if (!file || !connection || !connection.open)
    return alert("Copia o selecciona una imagen y conecta primero");

  if (file.size > 2 * 1024 * 1024)
    return alert("La imagen debe ocupar menos de 2 MB");

  if (!file.type.startsWith("image/"))
    return alert("Selecciona una imagen");

  const reader = new FileReader();

  reader.onload = () => {
    currentImage = reader.result;

    $("preview").src = currentImage;
    updatePreview();

    connection.send({
      type: "image",
      data: currentImage,
      name: file.name || "imagen-copiada",
      state: getState()
    });

    $("sendstatus").textContent = "Imagen enviada";
    pastedImage = null;
  };

  reader.readAsDataURL(file);
}
  
function clearImage() {
  if (!connection || !connection.open)
    return alert("No hay conexión");

  connection.send({type:"clear"});
  currentImage = null;
  $("preview").removeAttribute("src");
  $("sendstatus").textContent = "Imagen retirada";
}

function receiveData(data) {
  if (data.type === "image") {
    $("screen").classList.remove("hidden");
    $("screenImage").src = data.data;
    applyStyle($("screenImage"),data.state);
    $("incoming").textContent = "Imagen recibida: " + data.name;
  }

  if (data.type === "position") {
    applyStyle($("screenImage"),data.state);
  }

  if (data.type === "clear") {
    $("screenImage").removeAttribute("src");
    $("screen").classList.add("hidden");
    $("incoming").textContent = "Imagen retirada";
  }
}

function closeReceiver() {
  if (connection) connection.close();
  if (peer) peer.destroy();

  $("screen").classList.add("hidden");
  $("receiver").classList.add("hidden");
  showStatus("Receptor cerrado");
}
</script>

<div id="screen" class="hidden">
  <button id="screenClose" onclick="
    if(connection) connection.close();
    if(peer) peer.destroy();
    this.parentElement.classList.add('hidden');
  ">Cerrar</button>
  <img id="screenImage">
</div>

</body>
</html>
